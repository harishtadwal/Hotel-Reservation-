{% extends "base.html" %}

{% block title %}
Staff Registration | StayEase
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            🏨
        </div>

        <h1>Staff Registration</h1>

        <p>
            Register using your hotel Staff ID.
        </p>

        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
            >

            <label>Staff ID</label>

            <input
                type="text"
                name="staff_id"
                placeholder="Example: GP-STAFF-001"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button
                type="submit"
                class="primary-btn full-btn"
            >
                Register as Staff
            </button>

        </form>

        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>

        <p class="auth-footer">

            Are you a guest?

            <a href="{{ url_for('auth.register') }}">
                User Registration
            </a>

        </p>

    </div>

</section>

{% endblock %}
