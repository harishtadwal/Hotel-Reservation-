{% extends "base.html" %}

{% block title %}
Login | StayEase
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            🏨
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue your reservation.
        </p>


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>


            <button type="submit"
                    class="primary-btn full-btn">

                Login

            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">
                Create Account
            </a>
        </p>

        <p class="auth-footer">
            Are you hotel staff?
            <a href="{{ url_for('auth.staff_register') }}">
                Staff Registration
            </a>
        </p>
    </div>

</section>

{% endblock %}
